name: Fuzz

# `go test ./...` only replays the seed corpus and testdata/fuzz. This workflow generates new inputs for a
# few minutes per target. A failing input is uploaded as an artifact; commit it under testdata/fuzz with the
# fix so it becomes a regression test.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseVersion
            package: ./javaversion
          - target: FuzzParseRange
            package: ./javaversion
          - target: FuzzArchiveEntryPath
            package: ./command

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m ${{ matrix.package }}

      - name: Upload failing input
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/'

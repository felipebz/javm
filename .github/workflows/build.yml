name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-15 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Test Bash installer policy
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/test_install_policy.sh

      - name: Parse PowerShell installer
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }

  build:
    name: Build snapshot
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0  # Needed to get the version from git describe

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: 1.27.x
        cache: true

    - name: Run vet
      run: go vet ./...

    - name: Install Syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
      with:
        version: "~> v2"
        args: release --snapshot --clean

    - name: Attest snapshot artifacts
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.zip
          dist/*_checksums.txt

    - name: Upload artifacts javm-linux-arm64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-linux-arm64
        path: |
          dist/javm-linux-arm64.tar.gz
          dist/*_checksums.txt

    - name: Upload artifact javm-linux-x86_64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-linux-x86_64
        path: |
          dist/javm-linux-x86_64.tar.gz
          dist/*_checksums.txt

    - name: Upload artifact javm-darwin-arm64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-darwin-arm64
        path: |
          dist/javm-darwin-arm64.tar.gz
          dist/*_checksums.txt

    - name: Upload artifact javm-darwin-x86_64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-darwin-x86_64
        path: |
          dist/javm-darwin-x86_64.tar.gz
          dist/*_checksums.txt

    - name: Upload artifact javm-windows-x86_64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-windows-x86_64
        path: |
          dist/javm-windows-x86_64.zip
          dist/*_checksums.txt

    - name: Upload artifact javm-windows-arm64
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: javm-windows-arm64
        path: |
          dist/javm-windows-arm64.zip
          dist/*_checksums.txt

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
